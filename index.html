<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Reminders + Scheduling</title>
<style>
  :root {
    --bg: #14181f;
    --card: #1d232d;
    --line: #2c3544;
    --text: #e8ecf2;
    --muted: #8b97a9;
    --accent: #5aa9ff;
    --ok: #4cc38a;
    --err: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 10px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  .gear { background: none; border: 0; color: var(--muted); font-size: 22px; padding: 6px 8px; }
  textarea, input, select {
    width: 100%; background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; font: inherit; }
  textarea { min-height: 96px; resize: vertical; }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 2px 14px; }
  button.primary, button.secondary {
    width: 100%; border: 0; border-radius: 12px; padding: 14px; font: inherit; font-weight: 600; }
  button.primary { background: var(--accent); color: #07121f; }
  button.secondary { background: var(--card); color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .5; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 18px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; min-width: 0; }
  .check { display: flex; align-items: center; gap: 10px; margin-top: 12px; color: var(--text); font-size: 15px; }
  .check input { width: 20px; height: 20px; accent-color: var(--accent); padding: 0; }
  .btns { display: flex; gap: 10px; margin-top: 18px; }
  .status { margin-top: 14px; font-size: 14px; min-height: 20px; }
  .status.ok { color: var(--ok); } .status.err { color: var(--err); }
  .hidden { display: none !important; }

  /* item cards inside the confirm panel */
  .item { margin-top: 6px; }
  .multi .item { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px 14px; margin-top: 12px; }
  .itemHead { display: none; align-items: center; justify-content: space-between; padding-top: 10px; }
  .multi .itemHead { display: flex; }
  .itemNum { font-size: 13px; font-weight: 600; color: var(--accent); }
  .rm { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; padding: 6px 2px; text-decoration: underline; }
  .itemErr { color: var(--err); font-size: 13px; margin: 10px 2px 0; }

  .days { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { flex: 1 0 40px; background: var(--bg); color: var(--muted); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 0; font: inherit; font-size: 14px; }
  .multi .chip { background: var(--card); }
  .chip.on { background: var(--accent); color: #07121f; border-color: var(--accent); font-weight: 600; }
  .repeatNote { margin: 10px 2px 0; }

  .recent { margin-top: 24px; }
  .recent summary { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; font-weight: 600;
    cursor: pointer; list-style: none; padding: 8px 0; user-select: none; }
  .recent summary::-webkit-details-marker { display: none; }
  .recent summary::before { content: "\25B8\00a0"; }
  .recent[open] summary::before { content: "\25BE\00a0"; }
  .recent[open] summary { margin-bottom: 4px; }
  .recent li { list-style: none; padding: 9px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; font-size: 14px; }
  .recent ul { margin: 0; padding: 0; }
  .recent small { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Reminders + Scheduling</h1>
  <button class="gear" id="gear" aria-label="Settings">&#9881;</button>
</header>

<section id="settings" class="card hidden" style="margin-top:0">
  <h2>Settings</h2>
  <label for="url">Apps Script web app URL</label>
  <input id="url" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
  <label for="token">App token</label>
  <input id="token" type="password" placeholder="Same value as APP_TOKEN in Script Properties" autocomplete="off">
  <div class="btns">
    <button class="primary" id="saveSettings">Save settings</button>
  </div>
</section>

<main>
  <textarea id="text" autofocus></textarea>
  <button class="primary" id="go" style="margin-top:12px">Submit</button>
  <div id="status" class="status"></div>

  <section id="confirm" class="card hidden">
    <h2 id="confirmTitle">Does this look right?</h2>
    <div id="cards"></div>
    <div class="btns">
      <button class="secondary" id="cancel">Cancel</button>
      <button class="primary" id="save">Save</button>
    </div>
  </section>

  <details class="recent hidden" id="recentWrap">
    <summary>Added recently</summary>
    <ul id="recent"></ul>
  </details>
</main>

<template id="cardTpl">
  <div class="item">
    <div class="itemHead"><span class="itemNum"></span><button type="button" class="rm" data-f="remove">Remove</button></div>
    <label for="kind__N__">Type</label>
    <select id="kind__N__" data-f="kind">
      <option value="event">Calendar event</option>
      <option value="task">Task / reminder</option>
    </select>
    <label for="title__N__">Title</label>
    <input id="title__N__" data-f="title" type="text">
    <label for="date__N__">Date</label>
    <input id="date__N__" data-f="date" type="date">
    <div class="check" data-f="allDayRow"><input id="allDay__N__" data-f="allDay" type="checkbox"><label for="allDay__N__" style="margin:0;color:var(--text)">All day</label></div>
    <div class="row" data-f="timeRow">
      <div><label for="start__N__">Start</label><input id="start__N__" data-f="start" type="time"></div>
      <div data-f="endWrap"><label for="end__N__">End</label><input id="end__N__" data-f="end" type="time"></div>
    </div>
    <label for="repeat__N__">Repeat</label>
    <select id="repeat__N__" data-f="repeat">
      <option value="">Does not repeat</option>
      <option value="daily">Daily</option>
      <option value="weekly">Weekly</option>
      <option value="monthly">Monthly</option>
      <option value="yearly">Yearly</option>
    </select>
    <div data-f="repeatOpts" class="hidden">
      <div class="row">
        <div><label for="interval__N__" data-f="intervalLabel">Every (weeks)</label><input id="interval__N__" data-f="interval" type="number" min="1" step="1" value="1" inputmode="numeric"></div>
        <div><label for="ends__N__">Ends</label>
          <select id="ends__N__" data-f="ends"><option value="never">Never</option><option value="on">On a date</option></select></div>
      </div>
      <div data-f="daysWrap" class="hidden">
        <label>On days (leave blank for the same weekday as the date)</label>
        <div class="days">
          <button type="button" class="chip" data-d="MO">Mon</button>
          <button type="button" class="chip" data-d="TU">Tue</button>
          <button type="button" class="chip" data-d="WE">Wed</button>
          <button type="button" class="chip" data-d="TH">Thu</button>
          <button type="button" class="chip" data-d="FR">Fri</button>
          <button type="button" class="chip" data-d="SA">Sat</button>
          <button type="button" class="chip" data-d="SU">Sun</button>
        </div>
      </div>
      <div data-f="untilWrap" class="hidden"><label for="until__N__">Last day</label><input id="until__N__" data-f="until" type="date"></div>
      <p class="hint repeatNote" data-f="repeatNote"></p>
    </div>
    <label for="notes__N__">Notes</label>
    <input id="notes__N__" data-f="notes" type="text">
    <div class="itemErr hidden" data-f="err"></div>
  </div>
</template>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var cardCount = 0;

  function setStatus(msg, cls) {
    var s = $('status');
    s.textContent = msg || '';
    s.className = 'status' + (cls ? ' ' + cls : '');
  }

  function nowString() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    return days[d.getDay()] + ' ' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function call(payload) {
    var url = store.get('qa_url'), token = store.get('qa_token');
    if (!url || !token) {
      $('settings').classList.remove('hidden');
      return Promise.reject(new Error('Add your Apps Script URL and token in settings first.'));
    }
    payload.token = token;
    // text/plain avoids a CORS preflight, which Apps Script cannot answer
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) throw new Error(j.error || 'Something went wrong');
      return j;
    });
  }

  // ---------- item cards ----------

  function f(card, name) { return card.querySelector('[data-f="' + name + '"]'); }
  function allCards() { return Array.prototype.slice.call($('cards').querySelectorAll('.item')); }

  function syncFields(card) {
    var isEvent = f(card, 'kind').value === 'event';
    f(card, 'allDayRow').classList.toggle('hidden', !isEvent);
    f(card, 'timeRow').classList.toggle('hidden', isEvent && f(card, 'allDay').checked);
    f(card, 'endWrap').classList.toggle('hidden', !isEvent);
  }

  function syncRepeat(card) {
    var freq = f(card, 'repeat').value;
    var units = { daily: 'days', weekly: 'weeks', monthly: 'months', yearly: 'years' };
    f(card, 'repeatOpts').classList.toggle('hidden', !freq);
    if (!freq) return;
    f(card, 'intervalLabel').textContent = 'Every (' + units[freq] + ')';
    f(card, 'daysWrap').classList.toggle('hidden', freq !== 'weekly');
    f(card, 'untilWrap').classList.toggle('hidden', f(card, 'ends').value !== 'on');
    var note = '';
    if (f(card, 'kind').value === 'task') {
      note = f(card, 'start').value
        ? 'Repeating reminders are saved to Google Calendar, with an alert at the start time.'
        : 'Repeating items with no time are saved to Google Calendar as all-day events.';
    }
    f(card, 'repeatNote').textContent = note;
    f(card, 'repeatNote').classList.toggle('hidden', !note);
  }

  function fillCard(card, item) {
    var rep = item.repeat || null;
    f(card, 'kind').value = item.kind === 'task' ? 'task' : 'event';
    f(card, 'title').value = item.title || '';
    f(card, 'date').value = item.date || '';
    f(card, 'allDay').checked = !!item.allDay || !item.start;
    f(card, 'start').value = item.start || '';
    f(card, 'end').value = item.end || '';
    f(card, 'notes').value = item.notes || '';
    f(card, 'repeat').value = rep ? rep.freq : '';
    f(card, 'interval').value = rep && rep.interval ? rep.interval : 1;
    f(card, 'ends').value = rep && rep.until ? 'on' : 'never';
    f(card, 'until').value = rep && rep.until ? rep.until : '';
    Array.prototype.forEach.call(card.querySelectorAll('.chip'), function (c) {
      var on = !!(rep && rep.days && rep.days.indexOf(c.getAttribute('data-d')) >= 0);
      c.classList.toggle('on', on);
      c.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    syncFields(card);
    syncRepeat(card);
  }

  function readCard(card) {
    var kind = f(card, 'kind').value;
    var freq = f(card, 'repeat').value;
    var repeat = null;
    if (freq) {
      var days = [];
      if (freq === 'weekly') {
        Array.prototype.forEach.call(card.querySelectorAll('.chip.on'), function (c) {
          days.push(c.getAttribute('data-d'));
        });
      }
      repeat = {
        freq: freq,
        interval: Math.max(1, parseInt(f(card, 'interval').value, 10) || 1),
        days: days,
        until: f(card, 'ends').value === 'on' ? (f(card, 'until').value || null) : null
      };
    }
    return {
      kind: kind,
      title: f(card, 'title').value.trim(),
      date: f(card, 'date').value,
      allDay: kind === 'event' ? f(card, 'allDay').checked : false,
      start: f(card, 'start').value || null,
      end: kind === 'event' ? (f(card, 'end').value || null) : null,
      notes: f(card, 'notes').value.trim(),
      repeat: repeat
    };
  }

  function showCardError(card, msg) {
    var e = f(card, 'err');
    e.textContent = msg || '';
    e.classList.toggle('hidden', !msg);
  }

  function makeCard(item) {
    cardCount += 1;
    var wrap = document.createElement('div');
    wrap.innerHTML = $('cardTpl').innerHTML.replace(/__N__/g, String(cardCount));
    var card = wrap.firstElementChild;
    fillCard(card, item);
    f(card, 'kind').onchange = function () { syncFields(card); syncRepeat(card); };
    f(card, 'allDay').onchange = function () { syncFields(card); };
    f(card, 'start').oninput = function () { syncRepeat(card); };
    f(card, 'repeat').onchange = function () { syncRepeat(card); };
    f(card, 'ends').onchange = function () { syncRepeat(card); };
    Array.prototype.forEach.call(card.querySelectorAll('.chip'), function (c) {
      c.onclick = function () {
        var on = !c.classList.contains('on');
        c.classList.toggle('on', on);
        c.setAttribute('aria-pressed', on ? 'true' : 'false');
      };
    });
    f(card, 'remove').onclick = function () {
      card.parentNode.removeChild(card);
      refreshLayout();
      if (!allCards().length) { $('confirm').classList.add('hidden'); setStatus(''); }
    };
    return card;
  }

  function refreshLayout() {
    var cards = allCards();
    var n = cards.length;
    $('cards').classList.toggle('multi', n > 1);
    cards.forEach(function (c, i) {
      c.querySelector('.itemNum').textContent = 'Item ' + (i + 1) + ' of ' + n;
    });
    $('confirmTitle').textContent = n > 1 ? 'Found ' + n + ' items. Check each one.' : 'Does this look right?';
    $('save').textContent = n > 1 ? 'Save all ' + n : 'Save';
  }

  function showConfirm(items) {
    $('cards').innerHTML = '';
    items.forEach(function (it) { $('cards').appendChild(makeCard(it)); });
    refreshLayout();
    $('confirm').classList.remove('hidden');
    $('confirm').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ---------- recent list ----------

  function addRecent(item) {
    var list = [];
    try { list = JSON.parse(store.get('qa_recent') || '[]'); } catch (e) {}
    list.unshift({ kind: item.kind, title: item.title, date: item.date, start: item.start, repeat: !!item.repeat });
    list = list.slice(0, 8);
    store.set('qa_recent', JSON.stringify(list));
    renderRecent();
  }

  function renderRecent() {
    var list = [];
    try { list = JSON.parse(store.get('qa_recent') || '[]'); } catch (e) {}
    var ul = $('recent');
    ul.innerHTML = '';
    list.forEach(function (it) {
      var li = document.createElement('li');
      var when = it.date + (it.start ? ' ' + it.start : '');
      li.textContent = (it.kind === 'task' ? '☑ ' : '📅 ') + (it.repeat ? '↻ ' : '') + it.title + ' ';
      var sm = document.createElement('small');
      sm.textContent = when;
      li.appendChild(sm);
      ul.appendChild(li);
    });
    $('recentWrap').classList.toggle('hidden', list.length === 0);
  }

  // ---------- main actions ----------

  $('gear').onclick = function () {
    $('url').value = store.get('qa_url');
    $('token').value = store.get('qa_token');
    $('settings').classList.toggle('hidden');
  };
  $('saveSettings').onclick = function () {
    store.set('qa_url', $('url').value.trim());
    store.set('qa_token', $('token').value.trim());
    $('settings').classList.add('hidden');
    setStatus('Settings saved.', 'ok');
  };

  $('go').onclick = function () {
    var text = $('text').value.trim();
    if (!text) return;
    $('go').disabled = true;
    setStatus('Working on it…');
    $('confirm').classList.add('hidden');
    call({ action: 'parse', text: text, now: nowString() })
      .then(function (j) {
        var items = j.items || (j.item ? [j.item] : []);
        if (!items.length) throw new Error('Could not find an event or task in that.');
        setStatus('');
        showConfirm(items);
      })
      .catch(function (e) { setStatus(e.message, 'err'); })
      .then(function () { $('go').disabled = false; });
  };

  $('cancel').onclick = function () {
    $('confirm').classList.add('hidden');
    setStatus('');
  };

  function destination(item) {
    return (item.kind === 'task' && !item.start && !item.repeat) ? 'Google Tasks' : 'Google Calendar';
  }

  function describeAdded(items) {
    if (items.length === 1) return 'Added to ' + destination(items[0]) + '.';
    var tasks = items.filter(function (i) { return destination(i) === 'Google Tasks'; }).length;
    var cal = items.length - tasks, parts = [];
    if (cal) parts.push(cal + ' to Google Calendar');
    if (tasks) parts.push(tasks + ' to Google Tasks');
    return 'Added ' + parts.join(' and ') + '.';
  }

  $('save').onclick = function () {
    var cards = allCards();
    var items = [];
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i], it = readCard(card), problem = '';
      showCardError(card, '');
      if (!it.title || !it.date) problem = 'Title and date are required.';
      else if (it.repeat && f(card, 'ends').value === 'on' && !it.repeat.until) problem = 'Pick a last day, or set Ends to Never.';
      else if (it.repeat && it.repeat.until && it.repeat.until < it.date) problem = 'The last day is before the first date.';
      if (problem) {
        showCardError(card, problem);
        setStatus(cards.length > 1 ? 'Fix item ' + (i + 1) + ' first.' : problem, 'err');
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        return;
      }
      items.push(it);
    }
    if (!items.length) return;
    $('save').disabled = true;
    setStatus('Saving…');
    call({ action: 'save', items: items })
      .then(function (j) {
        var results = j.results || items.map(function () { return { ok: true }; });
        var added = [], failed = 0;
        results.forEach(function (r, idx) {
          if (r.ok) {
            added.push(items[idx]);
            addRecent(items[idx]);
            cards[idx].parentNode.removeChild(cards[idx]);
          } else {
            failed += 1;
            showCardError(cards[idx], r.error || 'Could not save this one.');
          }
        });
        if (!failed) {
          $('confirm').classList.add('hidden');
          $('text').value = '';
          setStatus(describeAdded(added), 'ok');
        } else {
          refreshLayout();
          setStatus((added.length ? describeAdded(added) + ' ' : '') + failed + ' could not be saved. Fix and save again.', 'err');
        }
      })
      .catch(function (e) { setStatus(e.message, 'err'); })
      .then(function () { $('save').disabled = false; });
  };

  $('text').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('go').click();
  });

  if (!store.get('qa_url') || !store.get('qa_token')) $('settings').classList.remove('hidden');
  renderRecent();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
